<style>
  :root {
    --navy:        #0B1B2B;
    --navy-2:      #0F2235;
    --navy-3:      #14304A;
    --graphite:    #1F2937;
    --graphite-2:  #2A2F36;
    --line:        rgba(245, 241, 234, 0.12);
    --line-strong: rgba(245, 241, 234, 0.22);
    --paper:       #F5F1EA;
    --paper-2:     #EAE3D6;
    --ink:         #0B1B2B;
    --ink-soft:    #3B4A5C;
    --muted:       #6B7587;
    --gold:        oklch(0.74 0.08 80);
    --gold-soft:   oklch(0.74 0.05 80);
    --serif:  "Playfair Display", "Times New Roman", Georgia, serif;
    --serif-body: "EB Garamond", Georgia, "Times New Roman", serif;
    --sans:   "EB Garamond", Georgia, "Times New Roman", serif;
    --mono:   "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }
  html, body { margin:0; padding:0; overflow-x: hidden; }
  body { width: 100%; }
  img, iframe { max-width: 100%; }
  a:hover { color: var(--gold); }
  input, select, textarea, button { font-size: 16px; } /* evita zoom no iOS */
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 16px;
    line-height: 1.55;
  }
  ::selection { background: var(--navy); color: var(--paper); }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  /* placeholder image (no hand-drawn SVG) */
  .ph {
    position: relative;
    background:
      repeating-linear-gradient(135deg,
        rgba(11,27,43,0.06) 0 1px,
        transparent 1px 9px),
      var(--paper-2);
    color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    text-align: center; padding: 16px;
  }
  .ph.dark {
    background:
      repeating-linear-gradient(135deg,
        rgba(245,241,234,0.05) 0 1px,
        transparent 1px 9px),
      var(--navy-2);
    color: rgba(245,241,234,0.55);
  }

  #root { min-height: 100vh; }

  /* ================================================
     MOBILE-FIRST — defaults para telas pequenas (< 768px)
     Inline styles do React assumem layout mobile.
     Os breakpoints abaixo são progressive enhancement.
     ================================================ */

  /* Mobile defaults via data-grid (sobrescreve inline styles do React) */
  [data-grid="2col"], [data-grid="contact"], [data-grid="titular"], [data-grid="foot-top"] {
    grid-template-columns: 1fr !important;
    gap: 32px !important;
  }
  [data-grid="areas"], [data-grid="quotes"], [data-grid="foot-cols"] {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
  }
  [data-grid="hero-stats"] {
    grid-template-columns: 1fr !important;
    gap: 12px !important;
    padding-top: 28px !important;
    max-width: 100% !important;
  }
  [data-grid="hero-stats"] [data-rule] { display: none !important; }
  [data-grid="step"] {
    grid-template-columns: 1fr !important;
    gap: 6px !important;
    padding: 28px 0 !important;
  }
  [data-section-inner] { padding: 0 20px !important; }
  section { padding: 64px 0 !important; }
  [data-hero] { padding-top: 110px !important; padding-bottom: 64px !important; }
  nav ul { display: none !important; }
  nav .nav-cta { padding: 8px 14px !important; font-size: 10px !important; letter-spacing: 0.14em !important; }
  nav > div { padding: 16px 20px !important; }

  /* Cards e formulário — paddings menores no mobile */
  [data-card="area"]      { padding: 28px 22px !important; min-height: auto !important; }
  [data-card="quote"]     { padding: 32px 24px 28px !important; min-height: auto !important; }
  [data-card="form"]      { padding: 24px 18px !important; }
  [data-card="form-sent"] { padding: 32px 20px !important; }

  /* Card do WhatsApp — stack vertical em telas pequenas pra não cortar */
  [data-card="wa"] {
    flex-direction: column !important;
    align-items: flex-start !important;
    padding: 18px !important;
    gap: 14px !important;
  }
  [data-card="wa"] [data-wa-icon] { width: 44px !important; height: 44px !important; }
  [data-card="wa"] [data-wa-num]  {
    font-size: 22px !important;
    word-break: break-word !important;
  }
  [data-card="wa"] > span {
    margin-left: 0 !important;
    align-self: flex-end !important;
  }

  /* Formulário — empilha email/telefone, inputs cabem na largura */
  [data-grid="form-row"] {
    grid-template-columns: 1fr !important;
    gap: 18px !important;
  }
  [data-card="form"] input,
  [data-card="form"] select,
  [data-card="form"] textarea { width: 100% !important; max-width: 100% !important; }

  /* Permite quebra natural em valores longos (endereço, links, e-mail) */
  [data-section-inner] { overflow-wrap: break-word; }

  /* Esconde <br/> dentro de títulos no mobile — deixa o texto fluir */
  [data-h2] br, [data-hero-title] br { display: none !important; }

  /* Tipografia mobile */
  [data-hero-title]   { font-size: clamp(34px, 9vw, 44px) !important; line-height: 1.08 !important; margin-bottom: 24px !important; }
  [data-hero-lede]    { font-size: 18px !important; line-height: 1.6 !important; margin-bottom: 36px !important; }
  [data-hero-meta]    { margin-bottom: 32px !important; gap: 8px !important; }
  [data-hero-actions] { flex-direction: column !important; align-items: stretch !important; gap: 10px !important; margin-bottom: 48px !important; }
  [data-hero-actions] a { justify-content: center; width: 100%; }
  [data-stat-n]       { font-size: 32px !important; }

  /* Botão flutuante — menor no mobile pra não atrapalhar */
  [data-fab] { width: 54px !important; height: 54px !important; right: 16px !important; bottom: 16px !important; }

  /* Tablet (≥ 640px) */
  @media (min-width: 640px) {
    [data-grid="areas"], [data-grid="foot-cols"] {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 16px !important;
    }
    [data-section-inner] { padding: 0 32px !important; }
    section { padding: 96px 0 !important; }
    [data-hero] { padding-top: 130px !important; padding-bottom: 96px !important; }
    [data-card="area"], [data-card="quote"], [data-card="form"] { padding: 36px 32px !important; }
    [data-hero-actions] { flex-direction: row !important; align-items: center !important; }
    [data-hero-actions] a { width: auto; }
    [data-grid="step"] { grid-template-columns: 90px 1fr !important; gap: 24px !important; padding: 32px 0 !important; }
  }

  /* Desktop (≥ 1024px) — restaura layout original do design */
  @media (min-width: 1024px) {
    nav ul { display: flex !important; }
    nav .nav-cta { padding: 10px 22px !important; font-size: 12px !important; letter-spacing: 0.18em !important; }
    nav > div { padding: 20px 40px !important; }

    [data-grid="2col"]      { grid-template-columns: 1fr 1.3fr !important; gap: 80px !important; }
    [data-grid="contact"]   { grid-template-columns: 1fr 1fr !important; gap: 80px !important; }
    [data-grid="titular"]   { grid-template-columns: 0.85fr 1fr !important; gap: 80px !important; }
    [data-grid="foot-top"]  { grid-template-columns: 1fr 2fr !important; gap: 80px !important; }
    [data-grid="areas"]     { grid-template-columns: repeat(2, 1fr) !important; gap: 1px !important; }
    [data-grid="quotes"]    { grid-template-columns: repeat(3, 1fr) !important; gap: 32px !important; }
    [data-grid="foot-cols"] { grid-template-columns: repeat(3, 1fr) !important; gap: 40px !important; }
    [data-grid="hero-stats"] {
      grid-template-columns: 1fr 1px 1fr 1px 1fr !important;
      gap: 0 !important;
      padding-top: 40px !important;
      max-width: 820px !important;
    }
    [data-grid="hero-stats"] [data-rule] { display: block !important; }
    [data-grid="step"] { grid-template-columns: 120px 1fr !important; gap: 40px !important; padding: 40px 0 !important; }

    [data-section-inner] { padding: 0 40px !important; }
    section { padding: 140px 0 !important; }
    [data-hero] { padding-top: 180px !important; padding-bottom: 120px !important; }

    [data-card="area"]  { padding: 44px 40px 40px !important; min-height: 320px !important; }
    [data-card="quote"] { padding: 48px 36px 36px !important; min-height: 380px !important; }
    [data-card="form"]  { padding: 44px 40px !important; }
    [data-card="wa"] {
      flex-direction: row !important;
      align-items: center !important;
      padding: 20px 22px !important;
      gap: 20px !important;
    }
    [data-card="wa"] [data-wa-icon] { width: 52px !important; height: 52px !important; }
    [data-card="wa"] [data-wa-num]  { font-size: 24px !important; }
    [data-card="wa"] > span { margin-left: auto !important; align-self: center !important; }

    [data-grid="form-row"] {
      grid-template-columns: 1fr 1fr !important;
      gap: 22px !important;
    }

    [data-h2] br, [data-hero-title] br { display: inline !important; }

    [data-hero-title]   { font-size: clamp(44px, 6.5vw, 92px) !important; line-height: 1.05 !important; margin-bottom: 36px !important; }
    [data-hero-lede]    { font-size: 22px !important; margin-bottom: 56px !important; }
    [data-hero-meta]    { margin-bottom: 56px !important; gap: 12px !important; }
    [data-stat-n]       { font-size: 44px !important; }

    [data-fab] { width: 60px !important; height: 60px !important; right: 24px !important; bottom: 24px !important; }
  }
</style>
</head>
